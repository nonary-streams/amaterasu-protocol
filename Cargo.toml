[workspace]
resolver = "2"
members = ["crates/gamestream", "crates/input-policy", "crates/network-policy", "crates/identity"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
amaterasu-abi = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "c72028359d9fa5205a6fa5f7267f28dc4d3a116f" }
amaterasu-contracts = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "c72028359d9fa5205a6fa5f7267f28dc4d3a116f" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
