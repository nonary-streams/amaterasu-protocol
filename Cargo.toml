[workspace]
resolver = "2"
members = ["crates/gamestream", "crates/input-policy", "crates/network-policy", "crates/identity"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
amaterasu-abi = { git = "file:///tmp/amaterasu-modular-repos/foundation", rev = "51ef23b1923335e0bb0c6af9eef685c6f4807520" }
amaterasu-contracts = { git = "file:///tmp/amaterasu-modular-repos/foundation", rev = "51ef23b1923335e0bb0c6af9eef685c6f4807520" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
