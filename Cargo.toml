[workspace]
resolver = "2"
members = ["crates/gamestream", "crates/input-policy", "crates/network-policy", "crates/identity"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
amaterasu-abi = { git = "file:///tmp/amaterasu-modular-repos/foundation", rev = "28da5667f73e26d812b0e485f50f0a5c77c5e4f0" }
amaterasu-contracts = { git = "file:///tmp/amaterasu-modular-repos/foundation", rev = "28da5667f73e26d812b0e485f50f0a5c77c5e4f0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
